<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bryan Soares | Backend Engineer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blpsoares.dev/" />
    <meta property="og:title" content="Bryan Soares | Backend Engineer" />
    <meta property="og:description" content="Especialista em Backend focado em escalabilidade e no uso estratégico de IA e Low-Code para acelerar entregas de alto valor." />
    <meta property="og:image" content="https://blpsoares.dev/bryan.png" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://blpsoares.dev/" />
    <meta property="twitter:title" content="Bryan Soares | Backend Engineer" />
    <meta property="twitter:description" content="Especialista em Backend focado em escalabilidade e no uso estratégico de IA e Low-Code para acelerar entregas de alto valor." />
    <meta property="twitter:image" content="https://blpsoares.dev/bryan.png" />

    <!-- Prevent FOUC (Flash of Unstyled Content) for dark mode -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e',
              }
            },
            keyframes: {
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'blink': {
                '0%, 49%': { opacity: '1' },
                '50%, 100%': { opacity: '0' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              'glow-pulse': {
                '0%, 100%': { opacity: '0.6', boxShadow: '0 0 0 0 rgba(45,212,191,0)' },
                '50%': { opacity: '1', boxShadow: '0 0 24px 2px rgba(45,212,191,0.45)' },
              },
              'scan': {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '50%': { opacity: '0.8' },
                '100%': { transform: 'translateY(2400%)', opacity: '0' },
              },
              'gradient-shift': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              'boot-line': {
                '0%': { opacity: '0', transform: 'translateX(-6px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.7s ease-out both',
              'blink': 'blink 1s step-end infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
              'scan': 'scan 4s linear infinite',
              'gradient-shift': 'gradient-shift 6s ease infinite',
              'boot-line': 'boot-line 0.35s ease-out both',
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Keep anchored sections clear of the fixed navbar when navigating via the menu */
      section[id] {
        scroll-margin-top: 6rem;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Animated gradient text for the hero headline + accents */
      .gradient-animate {
        background-size: 200% 200%;
        animation: gradient-shift 6s ease infinite;
      }

      /* Temporary highlight pulse applied by the AI agent when it scrolls
         the visitor to a section. Lasts ~1.8s then removes itself. */
      @keyframes agent-highlight-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.0);
          outline-color: rgba(45, 212, 191, 0.0);
        }
        15% {
          box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.35), 0 0 40px 6px rgba(45, 212, 191, 0.35);
          outline-color: rgba(45, 212, 191, 0.9);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.0);
          outline-color: rgba(45, 212, 191, 0.0);
        }
      }
      .agent-highlight {
        animation: agent-highlight-pulse 1.8s ease-out forwards;
        outline: 2px solid transparent;
        outline-offset: 6px;
        border-radius: 1rem;
        scroll-margin-top: 6rem;
      }

      /* Aurora glow layer behind the hero */
      .hero-aurora {
        background:
          radial-gradient(40% 50% at 75% 25%, rgba(45, 212, 191, 0.18), transparent 70%),
          radial-gradient(45% 55% at 20% 30%, rgba(16, 185, 129, 0.12), transparent 70%);
        filter: blur(20px);
      }
      :root.dark .hero-aurora {
        background:
          radial-gradient(40% 50% at 75% 25%, rgba(45, 212, 191, 0.22), transparent 70%),
          radial-gradient(45% 55% at 20% 30%, rgba(16, 185, 129, 0.14), transparent 70%);
      }

      @media (prefers-reduced-motion: reduce) {
        .gradient-animate, .agent-highlight { animation: none !important; }
      }
    </style>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
